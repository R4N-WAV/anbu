name: Build Anbu (Windows VST3)

# Runs on every upload, and manually: Actions tab -> "Build Anbu (Windows VST3)" -> "Run workflow".
on:
  push:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Configure (fetches JUCE 8.0.8 automatically)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 (Release, 64-bit)
        run: cmake --build build --config Release --target Anbu_VST3 --parallel

      - name: Collect plugin
        shell: pwsh
        run: |
          $src = "build/Anbu_artefacts/Release/VST3/Anbu.vst3"
          if (-not (Test-Path $src)) { throw "Built VST3 not found: $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $src "dist/Anbu.vst3"
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload plugin as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: Anbu-VST3-Windows
          path: dist
          if-no-files-found: error
          retention-days: 90
