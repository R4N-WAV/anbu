<h3>Anbu by R4N</h3>
<p>An optical-style leveling amplifier with a colour stage, made mainly for vocals.</p>
<p>This installs Anbu for every user on this Mac, as a VST3 and as an Audio Unit (AU).
Under <b>Customize</b> you can leave one of them out.</p>
<p>Runs natively on Apple Silicon and Intel Macs, macOS 10.13 or newer.</p>
