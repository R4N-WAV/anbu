name: Build Anbu (Windows + Mac)

# Runs on every push, and manually: Actions tab -> "Build Anbu (Windows + Mac)" -> "Run workflow".
# Builds on main that pass every check are published as the "latest" GitHub release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Configure (fetches JUCE 8.0.8 automatically)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DANBU_BUILD_TOOLS=ON

      - name: Build VST3 and checks (Release, 64-bit)
        run: cmake --build build --config Release --target Anbu_VST3 AnbuStress --parallel

      - name: Robustness checks
        shell: pwsh
        run: |
          & "build/AnbuStress_artefacts/Release/AnbuStress.exe" quick
          if ($LASTEXITCODE -ne 0) { throw "AnbuStress failed" }

      - name: Collect plugin
        shell: pwsh
        run: |
          $src = "build/Anbu_artefacts/Release/VST3/Anbu.vst3"
          if (-not (Test-Path $src)) { throw "Built VST3 not found: $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $src "dist/Anbu.vst3"
          Copy-Item INSTALL.md dist/
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload plugin as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: Anbu-VST3-Windows
          path: dist
          if-no-files-found: error
          retention-days: 90

      - name: Validate with pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $exe = Get-ChildItem -Recurse pluginval -Filter pluginval.exe | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::pluginval.exe not found in the download"; exit 1 }
          # pluginval is a GUI-subsystem program on Windows: start it and wait for it
          $args = @("--strictness-level", "5", "--validate-in-process", "--timeout-ms", "600000", "--output-dir", "pv-log", "--validate", "dist/Anbu.vst3")
          $p = Start-Process -FilePath $exe.FullName -ArgumentList $args -Wait -PassThru -NoNewWindow
          $code = $p.ExitCode
          $log = Get-ChildItem -Recurse pv-log -Filter *.txt -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName | Select-String -Pattern "FAILED|!!!|SUCCESS|Starting tests|Completed" | Select-Object -Last 25 | ForEach-Object { Write-Output "::warning::pluginval: $_" } }
          else { Write-Output "::warning::pluginval wrote no log" }
          if ($code -ne 0) { Write-Output "::error::pluginval failed (exit $code)"; exit 1 }
          Write-Output "pluginval passed"

      - name: Zip for the release
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath Anbu-VST3-Windows.zip -Force

      - name: Build the setup wizard (Inno Setup)
        shell: pwsh
        run: |
          # the wizard's dark style and colours need Inno Setup 6.7 or newer
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ok = (Test-Path $iscc) -and ((Get-Item $iscc).VersionInfo.FileVersionRaw -ge [version]"6.7.0")
          if (-not $ok) {
            Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile is.exe
            Start-Process .\is.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }
          Write-Output "Inno Setup $((Get-Item $iscc).VersionInfo.ProductVersion)"
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Anbu VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DPluginDir=$PWD\dist" "/DOutDir=$PWD\installer" packaging\windows\anbu.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem installer

      - name: Screenshots of the setup wizard (welcome page, folder page)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot ($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name")
          }
          $p = Start-Process installer\Anbu-Setup-Windows.exe -PassThru
          Start-Sleep -Seconds 8
          Shot "wizard-1-welcome.png"
          $ws = New-Object -ComObject WScript.Shell
          $w = Get-Process | Where-Object { $_.MainWindowTitle -like "*Anbu*" } | Select-Object -First 1
          if ($w) { [void] $ws.AppActivate($w.Id) }
          Start-Sleep -Milliseconds 600
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep -Seconds 2
          Shot "wizard-2-folder.png"
          Get-Process | Where-Object { $_.ProcessName -like "Anbu-Setup*" -or $_.ProcessName -like "*.tmp" -or $_.MainWindowTitle -like "*Anbu*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Test the setup wizard (install, check, uninstall)
        shell: pwsh
        run: |
          $vst = "$env:CommonProgramFiles\VST3\Anbu.vst3"
          $bin = "$vst\Contents\x86_64-win\Anbu.vst3"
          # an older copy is replaced
          New-Item -ItemType Directory -Force -Path "$vst\Contents\stale" | Out-Null
          $p = Start-Process installer\Anbu-Setup-Windows.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log | Select-Object -Last 30; throw "setup failed ($($p.ExitCode))" }
          if (-not (Test-Path $bin)) { throw "not installed: $bin" }
          if (Test-Path "$vst\Contents\stale") { throw "the old version was not replaced" }
          if ((Get-FileHash $bin).Hash -ne (Get-FileHash "dist\Anbu.vst3\Contents\x86_64-win\Anbu.vst3").Hash) { throw "installed file differs" }
          $un = "${env:ProgramFiles}\R4N\Anbu\unins000.exe"
          if (-not (Test-Path $un)) { throw "uninstaller missing" }
          if (Get-ChildItem "$env:CommonProgramFiles\VST3" -Filter "unins*") { throw "uninstaller files in the VST3 folder" }
          Write-Output "installed OK"
          # the uninstaller hands over to a copy of itself and returns at once: wait for the files to go
          Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          for ($i = 0; $i -lt 60 -and ((Test-Path $vst) -or (Test-Path $un)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $vst) { throw "uninstall left $vst" }
          if (Test-Path $un) { throw "uninstall left the uninstaller" }
          Write-Output "uninstalled OK"

      - name: Upload the setup wizard as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: Anbu-Setup-Windows
          path: installer/Anbu-Setup-Windows.exe
          if-no-files-found: error
          retention-days: 90

      - name: Keep the zip, the setup and the screenshots for the release job
        shell: pwsh
        run: |
          Copy-Item installer\Anbu-Setup-Windows.exe .
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          Get-ChildItem wizard-*.png -ErrorAction SilentlyContinue | Copy-Item -Destination shots

      - name: Upload for the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            Anbu-VST3-Windows.zip
            Anbu-Setup-Windows.exe
            shots/*.png
          if-no-files-found: error
          retention-days: 7

  # Universal build (Apple Silicon + Intel), VST3 and AU, tested here on Apple Silicon.
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Configure (fetches JUCE 8.0.8 automatically)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DANBU_BUILD_TOOLS=ON -DANBU_BUILD_SNAPSHOT=ON

      - name: Build VST3, AU and checks (Release, universal)
        run: cmake --build build --config Release --target Anbu_VST3 Anbu_AU AnbuStress AnbuSnapshot --parallel 3

      - name: Both architectures in every binary
        run: |
          set -e
          for f in build/Anbu_artefacts/Release/VST3/Anbu.vst3/Contents/MacOS/Anbu \
                   build/Anbu_artefacts/Release/AU/Anbu.component/Contents/MacOS/Anbu \
                   build/AnbuStress_artefacts/Release/AnbuStress; do
            echo "$f: $(lipo -archs "$f")"
            lipo "$f" -verify_arch arm64 x86_64
          done
          otool -arch all -l build/Anbu_artefacts/Release/VST3/Anbu.vst3/Contents/MacOS/Anbu | grep -A4 -E "LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION" | grep -E "version|minos" | sort -u

      - name: Robustness checks (Apple Silicon)
        run: build/AnbuStress_artefacts/Release/AnbuStress quick

      - name: Package (installer + INSTALL.md)
        run: packaging/mac/package.sh build

      - name: Keep the zip (for the release and the Intel test)
        uses: actions/upload-artifact@v4
        with:
          name: Anbu-macOS
          path: Anbu-macOS.zip
          if-no-files-found: error
          retention-days: 90

      - name: Keep the checks program for the Intel test
        uses: actions/upload-artifact@v4
        with:
          name: mac-checks
          path: build/AnbuStress_artefacts/Release/AnbuStress
          if-no-files-found: error
          retention-days: 7

      - name: Install with the installer, as a user would
        run: |
          set -e
          sudo installer -pkg "dist/Install Anbu.pkg" -target /
          for b in /Library/Audio/Plug-Ins/VST3/Anbu.vst3 /Library/Audio/Plug-Ins/Components/Anbu.component; do
            ls -l "$b/Contents/MacOS"
            codesign --verify --deep --strict --verbose=1 "$b"
          done

      - name: Validate the Audio Unit with auval (Apple's validator)
        run: |
          set -e
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i "R4Nx" || true
          auval -strict -v aufx Anb1 R4Nx

      - name: Validate VST3 and AU with pluginval
        run: |
          set -e
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval
          pv="$(find pluginval -path "*Contents/MacOS/pluginval" -type f | head -1)"
          for b in /Library/Audio/Plug-Ins/VST3/Anbu.vst3 /Library/Audio/Plug-Ins/Components/Anbu.component; do
            echo "::group::pluginval $b"
            "$pv" --strictness-level 5 --validate-in-process --timeout-ms 600000 --validate "$b"
            echo "::endgroup::"
          done

      - name: Panel snapshot (how the panel renders on a Mac)
        continue-on-error: true
        run: |
          build/AnbuSnapshot_artefacts/Release/AnbuSnapshot panel-mac.png 2
          build/AnbuSnapshot_artefacts/Release/AnbuSnapshot analyser-mac.png 1 analyser

      - name: Keep the snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-snapshot
          path: "*-mac.png"
          if-no-files-found: ignore
          retention-days: 14

  # The same zip, installed and validated on an Intel Mac (the x86_64 half of the universal build).
  mac-intel:
    needs: mac
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Get the Mac build
        uses: actions/download-artifact@v4
        with:
          name: Anbu-macOS

      - name: Get the checks program
        uses: actions/download-artifact@v4
        with:
          name: mac-checks

      - name: Robustness checks (Intel)
        run: |
          echo "machine: $(uname -m)"
          chmod +x AnbuStress
          ./AnbuStress quick

      - name: Install with the installer, as a user would
        run: |
          set -e
          ditto -x -k Anbu-macOS.zip unpacked
          ls -l unpacked
          sudo installer -pkg "unpacked/Install Anbu.pkg" -target /
          for b in /Library/Audio/Plug-Ins/VST3/Anbu.vst3 /Library/Audio/Plug-Ins/Components/Anbu.component; do
            codesign --verify --deep --strict --verbose=1 "$b"
          done

      - name: Validate the Audio Unit with auval
        run: |
          set -e
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i "R4Nx" || true
          auval -strict -v aufx Anb1 R4Nx

      - name: Validate VST3 and AU with pluginval
        run: |
          set -e
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval
          pv="$(find pluginval -path "*Contents/MacOS/pluginval" -type f | head -1)"
          for b in /Library/Audio/Plug-Ins/VST3/Anbu.vst3 /Library/Audio/Plug-Ins/Components/Anbu.component; do
            echo "::group::pluginval $b"
            "$pv" --strictness-level 5 --validate-in-process --timeout-ms 600000 --validate "$b"
            echo "::endgroup::"
          done

  publish:
    needs: [windows-vst3, mac, mac-intel]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
    steps:
      - name: Get the Windows zip
        uses: actions/download-artifact@v4
        with:
          name: release-windows

      - name: Get the Mac zip
        uses: actions/download-artifact@v4
        with:
          name: Anbu-macOS

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          ls -l Anbu-Setup-Windows.exe Anbu-VST3-Windows.zip Anbu-macOS.zip
          ls -l shots || true
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          notes=$(printf '%s\n' \
            "Latest validated build from commit ${{ github.sha }}." \
            "" \
            "- **Windows** (VST3, 64-bit): **Anbu-Setup-Windows.exe**. Run it and click through the wizard (Windows may show *Windows protected your PC*: click *More info* > *Run anyway*), then rescan plugins in your host. Or the zip: Anbu-VST3-Windows.zip, copy Anbu.vst3 into C:\\Program Files\\Common Files\\VST3." \
            "- **Mac** (VST3 + Audio Unit, Apple Silicon and Intel, macOS 10.13+): Anbu-macOS.zip. Unzip and open Install Anbu.pkg. It is not notarized by Apple: the first time, macOS blocks it; allow it in System Settings > Privacy & Security > Open Anyway." \
            "" \
            "Full guide: INSTALL.md (also inside both zips).")
          shots=$(ls shots/wizard-*.png 2>/dev/null || true)
          gh release create latest Anbu-Setup-Windows.exe Anbu-VST3-Windows.zip Anbu-macOS.zip $shots --target "${{ github.sha }}" --title "Anbu - latest build" --notes "$notes" --latest
